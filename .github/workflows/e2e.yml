name: E2E launch

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright-smoke:
    name: Playwright smoke + axe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @telehealth/web build
        env:
          APP_ENV: development
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          PAYMENT_MODE: sandbox
          AUTH_SECRET: development-only-auth-secret-32chars!

      - name: Install Playwright browsers
        run: pnpm --filter @telehealth/web exec playwright install --with-deps chromium firefox webkit

      - name: Launch suite (smoke + axe)
        run: pnpm --filter @telehealth/web test:e2e:launch
        env:
          CI: "1"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14