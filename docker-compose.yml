services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telehealth
    ports:
      - "5432:5432"
    volumes:
      - telehealth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telehealth"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  telehealth_pg_data: